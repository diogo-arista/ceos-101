hostname spine1
!
interface Ethernet1
   no switchport
   ip address 10.0.1.0/31
!
interface Ethernet2
   no switchport
   ip address 10.0.2.0/31
!
interface Loopback0
   ip address 10.255.0.1/32
!
ip routing
!
router bgp 65000
   router-id 10.255.0.1
   no bgp default ipv4-unicast
   neighbor LEAVES peer group
   neighbor LEAVES send-community extended
   neighbor 10.0.1.1 peer group LEAVES
   neighbor 10.0.1.1 remote-as 65001
   neighbor 10.0.2.1 peer group LEAVES
   neighbor 10.0.2.1 remote-as 65002
   !
   address-family evpn
      neighbor LEAVES activate
      neighbor LEAVES next-hop-unchanged
   !
   address-family ipv4
      neighbor LEAVES activate
      network 10.255.0.1/32
