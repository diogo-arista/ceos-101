hostname leaf2
!
vlan 100
   name TENANT-A
!
interface Ethernet1
   no switchport
   ip address 10.0.2.1/31
!
interface Ethernet2
   switchport
   switchport access vlan 100
!
interface Loopback0
   ip address 10.255.2.1/32
!
interface Loopback1
   ip address 10.255.100.2/32
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
!
ip virtual-router mac-address 00:1c:73:00:00:01
!
interface Vlan100
   ip address virtual 10.10.10.1/24
!
ip routing
!
router bgp 65002
   router-id 10.255.2.1
   no bgp default ipv4-unicast
   neighbor 10.0.2.0 remote-as 65000
   neighbor 10.0.2.0 send-community extended
   !
   vlan 100
      rd auto
      route-target both 100:10100
      redistribute learned
   !
   address-family evpn
      neighbor 10.0.2.0 activate
   !
   address-family ipv4
      neighbor 10.0.2.0 activate
      network 10.255.2.1/32
      network 10.255.100.2/32
