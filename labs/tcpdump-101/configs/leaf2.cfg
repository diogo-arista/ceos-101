hostname leaf2
!
interface Ethernet1
   no switchport
   ip address 10.0.2.1/31
!
interface Ethernet2
   no switchport
   ip address 192.168.2.1/24
!
interface Loopback0
   ip address 10.255.2.1/32
!
ip routing
!
router bgp 65002
   router-id 10.255.2.1
   neighbor 10.0.2.0 remote-as 65000
   network 10.255.2.1/32
   network 192.168.2.0/24
   !
   address-family ipv4
      neighbor 10.0.2.0 activate
