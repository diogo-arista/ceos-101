hostname leaf1
!
interface Ethernet1
   no switchport
   ip address 10.0.1.1/31
!
interface Ethernet2
   no switchport
   ip address 192.168.1.1/24
!
interface Loopback0
   ip address 10.255.1.1/32
!
ip routing
!
router bgp 65001
   router-id 10.255.1.1
   neighbor 10.0.1.0 remote-as 65000
   network 10.255.1.1/32
   network 192.168.1.0/24
   !
   address-family ipv4
      neighbor 10.0.1.0 activate
